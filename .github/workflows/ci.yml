name: Validate Vessel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static bundle
        run: npm run build

      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/worker.js
          node --check src/assistant-core.js
          node --check netlify/functions/assistant.mjs
          node --check netlify/functions/github-install.mjs
