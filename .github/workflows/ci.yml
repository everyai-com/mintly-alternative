name: Validate Vessel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static bundle
        run: npm run build

      - name: Run core tests
        run: npm test

      - name: Audit documentation quality
        run: npm run docs:check

      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/worker.js
          node --check src/assistant-core.js
          node --check src/docs-parser.js
          node --check src/docs-audit.js
          node --check src/docs-core.js
          node --check src/openapi-parser.js
          node --check src/openapi-core.js
          node --check public/api/api-explorer.js
          node --check scripts/build-docs.mjs
          node --check scripts/check-docs.mjs
          node --check netlify/functions/assistant.mjs
          node --check netlify/functions/docs.mjs
          node --check netlify/functions/github-install.mjs
          node --check netlify/functions/mcp.mjs
          node --check netlify/functions/openapi.mjs
